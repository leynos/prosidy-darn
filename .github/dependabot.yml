version: 2

# maturin (uv) and PyO3 (Cargo) are versioned independently yet build one
# extension, so an update to either alone may not build against the other.
# Joining both to this group puts the available updates for the pair into one
# pull request. It does not hold back a bump when only one of the two has an
# update, and a group cannot choose compatible versions.
#
# An entry that joins a group runs only that group, over the dependencies its
# `patterns` take, so the `cargo` and `uv` ecosystems each have two entries:
# the group entry, listed first, for the pair; and the plain entry, ignoring the
# pair, for everything else.
multi-ecosystem-groups:
  maturin-pyo3:
    # Dependabot rejects `open-pull-requests-limit` on an entry that joins a
    # multi-ecosystem group: the bound belongs to the group.
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"
updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      shared-actions:
        patterns:
          - 'leynos/shared-actions*'
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directories:
      - "/"
      - "/.github/actions/*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # The pair: the Python build backend joins the maturin-pyo3 group.
  - package-ecosystem: "uv"
    directory: "/"
    multi-ecosystem-group: "maturin-pyo3"
    patterns:
      - "maturin"
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for Python (uv-managed pyproject.toml/uv.lock). The
  # pair is handled by the group entry above, so it is ignored here.
  - package-ecosystem: "uv"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "maturin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # The pair: the extension's PyO3 bindings join the maturin-pyo3 group.
  - package-ecosystem: "cargo"
    directory: "/rust"
    multi-ecosystem-group: "maturin-pyo3"
    patterns:
      - "pyo3"
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for the Rust workspace. The pair is handled by the
  # group entry above, so it is ignored here.
  - package-ecosystem: "cargo"
    directory: "/rust"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pyo3"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Keep the pinned Rust toolchain current (RT-024).
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust-toolchain"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
