name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install CLI tools
        run: |
          for tool in mbake ty; do uv tool install ${tool}; done
          uv tool install ruff==0.15.12
          uv tool install nixie-cli==1.1.0

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: '**/*.md'

      - name: Enforce en-GB-oxendict spelling
        run: make spelling

      - name: Install the YAML lint tools
        uses: leynos/shared-actions/.github/actions/install-yaml-lint@ab6505246c6b043b742a225e428e00448c0a37af
      - name: Run Python lint and dead-code detection
        run: make lint

      - name: Dead-code gate
        uses: leynos/shared-actions/.github/actions/df12-skylos@ab6505246c6b043b742a225e428e00448c0a37af


      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@ab6505246c6b043b742a225e428e00448c0a37af

      - name: Run Rust lint
        run: make lint-rust

      - name: Set up Rust for Merman
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.95.0'

      - name: Install Merman
        run: cargo +1.95.0 install merman-cli --version '=0.7.0' --locked

      - name: Validate Mermaid diagrams
        run: make nixie

      - name: Run typechecker
        run: make typecheck

      - name: Run tests
        run: make test

      # Pull requests measure coverage and ratchet it without talking to
      # CodeScene. Coverage is published to CodeScene from main by
      # coverage-main.yml alone; `make test-workflow-contracts` holds that
      # shape, and the generator selection here must match the publisher's.
      - name: Measure coverage
        if: github.event_name == 'pull_request'
        # Pin one interpreter in both lanes: generate-coverage builds its own
        # venv with a bare `uv venv`, which takes whatever uv finds first.
        env:
          UV_PYTHON: '3.14'
        uses: leynos/shared-actions/.github/actions/generate-coverage@ab6505246c6b043b742a225e428e00448c0a37af
        with:
          python-source: ./prosidy_darn
          output-path: coverage.xml
          format: cobertura
          artefact-name-suffix: prosidy-darn
          with-ratchet: 'true'
          publish-artefact: 'false'

      - name: Check the CV-005 contracts
        run: make test-workflow-contracts
