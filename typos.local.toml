# Repository-specific quotations and machine interfaces.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Inline code spans, which this repository's spelling check has always
  # masked; preserved through the migration to the shared gate.
  '`[^`\n]+`',
  # Valid compounds whose components must remain visible elsewhere.
  '\bMis-modelled\b',
  '\bpre-empted\b',
  # Existing trace messages are diagnostic contracts.
  '(?m)^        "build_native_wheel_artifact: completed; output dir contains %s",$',
  '(?m)^    _logger\.debug\("build_native_wheel_artifact: running %s", command\)$',
  # GitHub's pull-request event value is an exact API literal.
  '(?m)^    types: \[opened, reopened, synchronize, labeled, ready_for_review\]$',
]

[files]
exclude = []
